<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Análisis Loterías</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>🎰 Análisis Loterías Colombianas con IA</h1>
        </div>
    </header>

    <main class="container">
        <section>
            <h2>Últimos Resultados</h2>
            <div id="resultados" class="resultados-grid"><em>No hay datos disponibles aún</em></div>
        </section>

        <section>
            <h2>Predicciones para Hoy</h2>
            <div id="predicciones" class="predicciones-grid"><em>No hay predicciones disponibles</em></div>
        </section>

        <section>
            <h2>Análisis Números Especiales</h2>
            <div id="analisis" class="analisis-grid"><em>No hay análisis disponible</em></div>
        </section>

        <button id="btnActualizar">Actualizar Resultados</button>
        <div id="progreso" style="margin-top:10px;"></div>
    </main>

    <script>
        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("Error en fetch: " + res.status);
            return await res.json();
        }

        async function cargarResultados() {
            const datos = await fetchJSON('/get-sorteos');
            const section = document.getElementById('resultados');
            section.innerHTML = '';
            if (Object.keys(datos).length === 0) {
                section.innerHTML = '<em>No hay datos disponibles aún</em>';
            } else {
                for (const [loteria, val] of Object.entries(datos)) {
                    const div = document.createElement('div');
                    div.className = 'resultado-card';
                    div.innerHTML = `<h3>${loteria}</h3><div class="numero">${val.numero}</div><div>Serie: ${val.signo}</div><div>Fecha: ${val.fecha}</div>`;
                    section.appendChild(div);
                }
            }
        }

        async function cargarPredicciones() {
            const datos = await fetchJSON('/get-predicciones');
            const section = document.getElementById('predicciones');
            section.innerHTML = '';
            if (Object.keys(datos).length === 0) {
                section.innerHTML = '<em>No hay predicciones disponibles</em>';
            } else {
                for (const [loteria, val] of Object.entries(datos)) {
                    const div = document.createElement('div');
                    div.className = 'prediccion-card';
                    div.innerHTML = `<h3>${loteria}</h3><div class="numero">${val.numero}</div><div>Frecuencia: ${val.frecuencia}</div>`;
                    section.appendChild(div);
                }
            }
        }

        async function cargarAnalisis() {
            const datos = await fetchJSON('/get-analisis-numeros');
            const section = document.getElementById('analisis');
            section.innerHTML = '';
            if (Object.keys(datos).length === 0) {
                section.innerHTML = '<em>No hay análisis disponible</em>';
            } else {
                for (const key in datos) {
                    const val = datos[key];
                    const div = document.createElement('div');
                    div.className = 'analisis-card';
                    div.innerHTML = `<h3>Número ${val.numero}</h3><div>Total: ${val.apariciones_total}</div><div>Último Año: ${val.apariciones_1ano}</div>`;
                    section.appendChild(div);
                }
            }
        }

        async function cargarProgreso() {
            try {
                const prog = await fetchJSON('/get-progreso');
                const div = document.getElementById('progreso');
                div.textContent = `Estado: ${prog.estado} - ${prog.mensaje} (${prog.porcentaje}%)`;
            } catch {
                // handle error silently
            }
        }

        document.getElementById('btnActualizar').addEventListener('click', () => {
            fetch('/start-analysis', { method: 'POST' });
        });

        async function refrescar() {
            await cargarProgreso();
            await cargarResultados();
            await cargarPredicciones();
            await cargarAnalisis();
        }

        setInterval(refrescar, 5000);
        window.onload = refrescar;
    </script>
</body>
</html>
