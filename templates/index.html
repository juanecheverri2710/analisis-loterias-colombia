<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Loterías Colombia</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎰 Análisis de Loterías Colombia</h1>
            <p>Predicciones inteligentes basadas en datos históricos</p>
        </header>

        <main>
            <section class="control-section">
                <button id="btnAnalizar" class="btn btn-primary">📊 Iniciar Análisis</button>
                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Procesando...</p>
                </div>
            </section>

            <section class="predicciones-section">
                <h2>🎯 Predicciones de HOY</h2>
                <div id="predicciones" class="predicciones-grid">
                    <p class="placeholder">Cargando predicciones...</p>
                </div>
            </section>

            <section class="sorteos-section">
                <h2>📅 Últimos Resultados</h2>
                <div id="sorteos" class="sorteos-grid">
                    <p class="placeholder">Cargando sorteos...</p>
                </div>
            </section>

            <section class="resultados-section">
                <h2>📈 Análisis Completo</h2>
                <div id="resultados" class="resultados-content">
                    <pre id="resultadosText">Haz clic en "Iniciar Análisis"</pre>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 Análisis de Loterías Colombia</p>
        </footer>
    </div>

    <script>
        document.getElementById('btnAnalizar').addEventListener('click', async function() {
            this.disabled = true;
            document.getElementById('loading').classList.remove('hidden');
            
            await fetch('/start-analysis', {method: 'POST'});
            
            setTimeout(async () => {
                const res = await fetch('/get-results');
                const data = await res.json();
                document.getElementById('resultadosText').textContent = data.result || 'Completado';
                document.getElementById('loading').classList.add('hidden');
                
                await cargarPredicciones();
                await cargarSorteos();
                this.disabled = false;
            }, 2000);
        });

        async function cargarPredicciones() {
            const res = await fetch('/get-predicciones');
            const data = await res.json();
            let html = '';
            for (let [loteria, pred] of Object.entries(data)) {
                html += `<div class="card prediccion"><h3>${loteria}</h3><div class="numero">${pred.split(' ')[0]}</div><p class="signo">${pred.split(' ')[1] || ''}</p></div>`;
            }
            document.getElementById('predicciones').innerHTML = html || '<p class="placeholder">Sin datos</p>';
        }

        async function cargarSorteos() {
            const res = await fetch('/get-sorteos');
            const data = await res.json();
            let html = '';
            for (let [loteria, info] of Object.entries(data)) {
                html += `<div class="card sorteo"><h3>${loteria}</h3><div class="numero">${info.numero}</div><p class="detalle">Signo: ${info.signo}</p><p class="fecha">${info.fecha}</p></div>`;
            }
            document.getElementById('sorteos').innerHTML = html || '<p class="placeholder">Sin datos</p>';
        }

        cargarPredicciones();
        cargarSorteos();
    </script>
</body>
</html>
